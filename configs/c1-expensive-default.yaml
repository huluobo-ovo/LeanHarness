# C1: expensive-model baseline with the default (unmodified) harness.
#
# The actual model is intentionally supplied by the launcher at run time.  The
# group must record one OpenRouter model ID before beginning the paid batch.
experiment:
  id: c1-expensive-default-v1
  owner: shared-baseline
  status: formal_baseline
  comparison_baseline: C0

lineage:
  base_agent_config: contributions/liu-yalin/developer_pack/settings/mini_base.yaml
  task_list: configs/task_list_40.txt
  source_task_list: contributions/liu-yalin/developer_pack/settings/task_list_40.txt

runtime:
  max_steps: 30
  wall_time_limit_seconds: 900
  seed_policy: shared_team_seed_required
  per_task_usd_cap: 0.10

model:
  provider: openrouter
  name: TEAM_DECISION_REQUIRED
  # Supply the team-approved expensive model with --model at launch time.

# Both switches are deliberately off.  The reusable Harbor adapter can still
# load this file, but it passes every action and tool result through unchanged.
leanharness:
  tool_interface:
    guard_enabled: false
    normalizer_enabled: false
    max_command_chars: 12000
    summary_max_chars: 600
    raw_tail_max_chars: 3000

outputs:
  run_root: runs/c1-formal
  retain_raw_harbor_result: true
  retain_agent_logs: true
  retain_trajectories: true
  retain_cost_snapshot: true
