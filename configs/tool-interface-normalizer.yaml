# Role 5 candidate configuration: R5-A (result normalizer only).
#
# This is LeanHarness adapter metadata. It becomes executable once the shared
# Harbor/mini-SWE-agent adapter reads the `leanharness` block. Do not run this
# directly with upstream mini-SWE-agent before that adapter integration exists.
experiment:
  id: role5-t1-normalizer-v1
  owner: role-5
  status: candidate_pending_team_model_decision
  comparison_baseline: C0

lineage:
  base_agent_config: contributions/liu-yalin/developer_pack/settings/mini_base.yaml
  task_list: configs/task_list_40.txt
  source_task_list: contributions/liu-yalin/developer_pack/settings/task_list_40.txt

runtime:
  max_steps: 30
  wall_time_limit_seconds: 900
  seed_policy: shared_team_seed_required
  per_task_usd_cap: 0.06

model:
  provider: openrouter
  name: TEAM_DECISION_REQUIRED
  # Fill only after the group agrees on one inexpensive baseline model.

leanharness:
  tool_interface:
    guard_enabled: false
    normalizer_enabled: true
    max_command_chars: 12000
    summary_max_chars: 600
    raw_tail_max_chars: 3000

outputs:
  run_root: runs/role5/t1-normalizer
  retain_raw_harbor_result: true
  retain_agent_logs: true
  retain_trajectories: true
  retain_cost_snapshot: true
